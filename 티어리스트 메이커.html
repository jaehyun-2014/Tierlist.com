<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>티어리스트 메이커</title>
<style>
:root{--bg:#f6f6f6;--panel:#fff;--zone:#ececec;--text:#111;--sub:#777;--line:#d4d4d4;--btn:#ebebeb;--pri:#2563eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--panel:#181818;--zone:#242424;--text:#f2f2f2;--sub:#8f8f8f;--line:#333;--btn:#2c2c2c;--pri:#3b82f6}}
:root[data-theme="dark"]{--bg:#0e0e0e;--panel:#181818;--zone:#242424;--text:#f2f2f2;--sub:#8f8f8f;--line:#333;--btn:#2c2c2c;--pri:#3b82f6}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:0 auto;padding:16px 12px 60px}
h1{font-size:28px;text-align:center;margin:8px 0 14px;outline:none;font-weight:700;letter-spacing:-.01em}
h1:empty::before{content:"티어리스트 제목";color:var(--sub)}
.tiers{border:1px solid var(--line);background:var(--line);display:flex;flex-direction:column;gap:2px}
.tier{display:flex;background:var(--zone);min-height:92px}
.lab{width:96px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;color:#111;font-weight:700;font-size:20px;word-break:break-all;cursor:pointer;line-height:1.2}
.zone{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;min-height:90px;padding:1px}
.zone.over{outline:3px dashed var(--pri);outline-offset:-3px}
.ctl{width:44px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--panel)}
.ctl button{border:0;background:none;color:var(--sub);font-size:16px;cursor:pointer;padding:2px 6px}
.ctl button:hover{color:var(--text)}
.it{width:88px;height:88px;object-fit:cover;margin:1px;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-drag:none}
.it.dim{opacity:.3}
.ghost{position:fixed;z-index:50;pointer-events:none;object-fit:cover;opacity:.9;box-shadow:0 6px 16px #0008}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
button.b{border:0;background:var(--btn);color:var(--text);padding:10px 16px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}
button.b.p{background:var(--pri);color:#fff}
.pool{margin-top:6px;border:1px solid var(--line);background:var(--panel);padding:8px}
.pool .zone{background:var(--zone);min-height:104px}
.hint{color:var(--sub);font-size:14px;margin:0 0 8px}
.trash{margin-top:10px;border:1px dashed var(--line);color:var(--sub);text-align:center;padding:12px;border-radius:6px}
.trash.over{border-color:var(--pri);color:var(--pri)}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal[hidden]{display:none}
.card{background:var(--panel);width:100%;max-width:420px;border-radius:10px;padding:18px;max-height:90vh;overflow:auto}
.card h2{margin:0 0 12px;font-size:18px}
.card input[type=text]{width:100%;padding:10px;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw i.on{border-color:var(--text)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.card img.out{width:100%;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title" contenteditable="true" spellcheck="false">나의 티어리스트</h1>
  <div class="tiers" id="tiers"></div>
  <div class="bar">
    <button class="b p" id="add">+ 티어 추가</button>
    <button class="b" id="save">이미지로 저장</button>
    <button class="b" id="reset">모두 초기화</button>
  </div>
  <div class="pool">
    <p class="hint">이미지를 추가하거나 이 화면에 끌어다 놓으세요. 사진을 티어로 끌어서 순위를 매깁니다.</p>
    <div class="zone" id="pool"></div>
    <div class="bar"><button class="b p" id="up">이미지 추가</button></div>
    <div class="trash" id="trash">여기에 놓으면 이미지가 삭제됩니다</div>
  </div>
</div>
<input type="file" id="file" accept="image/*" multiple hidden>

<div class="modal" id="modal" hidden>
  <div class="card">
    <h2>티어 설정</h2>
    <input type="text" id="nm" maxlength="20" placeholder="티어 이름">
    <div class="sw" id="sw"></div>
    <div class="row">
      <button class="b" id="above">위에 티어 추가</button>
      <button class="b" id="below">아래에 티어 추가</button>
      <button class="b" id="clear">이미지 비우기</button>
      <button class="b" id="del">티어 삭제</button>
      <button class="b p" id="close">완료</button>
    </div>
  </div>
</div>
<div class="modal" id="exp" hidden>
  <div class="card">
    <h2>이미지로 저장</h2>
    <p class="hint">이미지를 길게 누르거나 오른쪽 클릭해서 저장하세요.</p>
    <img class="out" id="out" alt="티어리스트 이미지">
    <div class="row"><button class="b p" id="xclose">닫기</button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const COLORS=["#1d4ed8","#2563eb","#60a5fa","#a8c8fa","#dbe8fd","#ffffff","#e0e0e0","#b5b5b5","#858585","#575757","#2b2b2b","#000000"];
function ink(c){const m=c.startsWith("#")?[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)):c.match(/\d+/g).map(Number);return (m[0]*299+m[1]*587+m[2]*114)/1000<140?"#fff":"#111";}
const DEFAULT=[["S",0],["A",1],["B",2],["C",3],["D",4],["F",5]];
const tiers=$("#tiers"),pool=$("#pool");
let cur=null;

function addRow(name,color,ref,after){
  const r=document.createElement("div");r.className="tier";
  r.innerHTML='<div class="lab"></div><div class="zone"></div><div class="ctl"><button data-m="-1" title="위로">▲</button><button data-m="1" title="아래로">▼</button><button data-g="1" title="설정">⚙</button></div>';
  const l=r.querySelector(".lab");l.textContent=name;l.style.background=color;l.style.color=ink(color);
  l.onclick=()=>openModal(r);
  r.querySelector("[data-g]").onclick=()=>openModal(r);
  r.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
    const d=+b.dataset.m;
    if(d<0&&r.previousElementSibling)tiers.insertBefore(r,r.previousElementSibling);
    if(d>0&&r.nextElementSibling)tiers.insertBefore(r.nextElementSibling,r);
  });
  if(ref)tiers.insertBefore(r,after?ref.nextSibling:ref);else tiers.appendChild(r);
  return r;
}
function init(){tiers.innerHTML="";pool.innerHTML="";DEFAULT.forEach(([n,c])=>addRow(n,COLORS[c]));}
init();

/* 설정 창 */
const sw=$("#sw");
COLORS.forEach(c=>{const i=document.createElement("i");i.style.background=c;i.onclick=()=>{const l=cur.querySelector(".lab");l.style.background=c;l.style.color=ink(c);mark();};sw.appendChild(i);});
function mark(){const c=cur.querySelector(".lab").style.backgroundColor;[...sw.children].forEach(i=>i.classList.toggle("on",i.style.backgroundColor===c));}
function openModal(r){cur=r;$("#nm").value=r.querySelector(".lab").textContent;mark();$("#modal").hidden=false;}
$("#nm").oninput=e=>{cur.querySelector(".lab").textContent=e.target.value;};
$("#close").onclick=()=>{$("#modal").hidden=true;};
$("#above").onclick=()=>{cur=addRow("새 티어","#e0e0e0",cur,false);openModal(cur);};
$("#below").onclick=()=>{cur=addRow("새 티어","#e0e0e0",cur,true);openModal(cur);};
$("#clear").onclick=()=>{cur.querySelectorAll(".it").forEach(i=>pool.appendChild(i));$("#modal").hidden=true;};
$("#del").onclick=()=>{cur.querySelectorAll(".it").forEach(i=>pool.appendChild(i));cur.remove();$("#modal").hidden=true;};
$("#add").onclick=()=>{const r=addRow("새 티어","#e0e0e0");openModal(r);};
let rt=null;
$("#reset").onclick=e=>{const b=e.currentTarget;if(!rt){b.textContent="정말 초기화할까요? 한 번 더 누르세요";rt=setTimeout(()=>{rt=null;b.textContent="모두 초기화";},3000);return;}clearTimeout(rt);rt=null;b.textContent="모두 초기화";init();$("#title").textContent="나의 티어리스트";};
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").hidden=true;};
$("#exp").onclick=e=>{if(e.target.id==="exp")$("#exp").hidden=true;};
$("#xclose").onclick=()=>{$("#exp").hidden=true;};

/* 이미지 업로드 */
function addFiles(files){
  [...files].filter(f=>f.type.startsWith("image/")).forEach(f=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.className="it";im.draggable=false;im.src=fr.result;im.onpointerdown=e=>startDrag(e,im);im.ondblclick=()=>pool.appendChild(im);pool.appendChild(im);};
    fr.readAsDataURL(f);
  });
}
$("#up").onclick=()=>$("#file").click();
$("#file").onchange=e=>{addFiles(e.target.files);e.target.value="";};
addEventListener("dragover",e=>e.preventDefault());
addEventListener("drop",e=>{e.preventDefault();if(e.dataTransfer&&e.dataTransfer.files.length)addFiles(e.dataTransfer.files);});

/* 끌어서 옮기기 (마우스·터치 공통) */
let dr=null;
function startDrag(e,im){
  if(e.button>0)return;
  e.preventDefault();
  const r=im.getBoundingClientRect();
  const g=im.cloneNode();g.className="ghost";g.style.width=r.width+"px";g.style.height=r.height+"px";
  document.body.appendChild(g);
  dr={im,g,w:r.width,h:r.height};
  im.classList.add("dim");
  mv(e);
}
function zoneAt(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest(".zone, .trash");}
function mv(e){
  if(!dr)return;
  dr.g.style.left=(e.clientX-dr.w/2)+"px";dr.g.style.top=(e.clientY-dr.h/2)+"px";
  document.querySelectorAll(".over").forEach(z=>z.classList.remove("over"));
  const z=zoneAt(e.clientX,e.clientY);if(z)z.classList.add("over");
}
addEventListener("pointermove",mv);
function end(e){
  if(!dr)return;
  const z=zoneAt(e.clientX,e.clientY),{im,g}=dr;
  document.querySelectorAll(".over").forEach(x=>x.classList.remove("over"));
  g.remove();im.classList.remove("dim");dr=null;
  if(!z)return;
  if(z.id==="trash"){im.remove();return;}
  let before=null;
  for(const c of z.querySelectorAll(".it")){
    if(c===im)continue;
    const b=c.getBoundingClientRect();
    if(e.clientY<b.top||(e.clientY<=b.bottom&&e.clientX<b.left+b.width/2)){before=c;break;}
  }
  z.insertBefore(im,before);
}
addEventListener("pointerup",end);
addEventListener("pointercancel",end);

/* 이미지로 저장 */
$("#save").onclick=()=>{
  const W=1000,LW=120,S=88,per=Math.floor((W-LW)/S),T=60;
  const rows=[...tiers.children].map(r=>({n:r.querySelector(".lab").textContent,c:r.querySelector(".lab").style.background,im:[...r.querySelectorAll(".it")]}));
  const hs=rows.map(r=>Math.max(1,Math.ceil(r.im.length/per))*S);
  const cv=document.createElement("canvas");cv.width=W;cv.height=T+hs.reduce((a,b)=>a+b+2,0);
  const x=cv.getContext("2d");
  x.fillStyle="#1b1b1b";x.fillRect(0,0,W,cv.height);
  x.fillStyle="#fff";x.font="700 30px sans-serif";x.textAlign="center";x.textBaseline="middle";
  x.fillText($("#title").textContent,W/2,T/2);
  let y=T;
  rows.forEach((r,i)=>{
    x.fillStyle="#2f2f2f";x.fillRect(LW,y,W-LW,hs[i]);
    x.fillStyle=r.c;x.fillRect(0,y,LW,hs[i]);
    x.fillStyle=ink(r.c);x.font="700 24px sans-serif";x.fillText(r.n.slice(0,12),LW/2,y+hs[i]/2,LW-12);
    r.im.forEach((im,k)=>{
      const px=LW+(k%per)*S,py=y+Math.floor(k/per)*S,s=Math.min(im.naturalWidth,im.naturalHeight);
      x.drawImage(im,(im.naturalWidth-s)/2,(im.naturalHeight-s)/2,s,s,px,py,S,S);
    });
    y+=hs[i]+2;
  });
  $("#out").src=cv.toDataURL("image/png");
  $("#exp").hidden=false;
};
</script>
</body>
</html>
